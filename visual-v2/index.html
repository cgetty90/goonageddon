<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="goonageddon-build" content="visual-v2-silent-1">
<meta name="theme-color" content="#100728">
<title>GOONAGEDDON · Visual V2 Demo</title>
<meta name="description" content="GOONAGEDDON, a neon sci-fi slot game.">
<link rel="preload" as="image" href="assets/goon-v5/logo.png">
<link rel="icon" type="image/png" href="assets/reel-art-v4/scatter-ufo.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="visual-v2.css">
<link rel="stylesheet" href="dockmaster.css">
<link rel="stylesheet" href="command-bridge.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<main id="game" aria-label="Goonageddon">
  <div class="salvage" aria-hidden="true"><i class="nebula"></i><i class="stars"></i><img class="orb-planet" src="assets/visual/symbols/planet.webp" alt=""><img class="orb-rock" src="assets/visual/symbols/asteroid.webp" alt=""><img class="orb-gantry" src="assets/visual/environment/gantry.webp" alt=""><img class="orb-tug" src="assets/visual/environment/tug.webp" alt=""><i class="beacon"></i></div>
  <header>
    
    <div class="dock-crew" aria-hidden="true">
      <img class="dock-cyclopz" src="assets/visual/symbols/cyclopz.webp" alt="">
      <img class="dock-commander" src="assets/visual/symbols/commander.webp" alt="">
      <img class="dock-octo" src="assets/visual/symbols/octo-lab.webp" alt="">
      <img class="dock-cow" src="assets/visual/symbols/space-cow.webp" alt="">
    </div>
    <h1><img src="assets/goon-v5/logo.png" alt="Goonageddon"></h1>
    <span class="demo-badge">FICTIONAL CREDITS</span><div class="active-ways" aria-label="Active ways"><span>Active ways</span><strong id="ways">—</strong></div>
    <div id="mode" class="modeplate" hidden></div>
  </header>
  <div class="stage">
    <aside id="chaos" class="plate" aria-labelledby="chaos-title" hidden>
      <div class="chaos-heading">
        <h2 id="chaos-title">Chaos Progression</h2>
        <div id="points">0 / 120 Chaos Points</div>
      </div>
      <div id="feature">
        <strong id="feature-number" hidden>8</strong>
        <span id="feature-label">FREE SPINS</span>
        <span id="feature-stage" hidden></span>
      </div>
      <progress id="chaos-progress" max="120" value="0" aria-labelledby="chaos-title"></progress>
      <div id="meter"></div>
      <div id="commander-reaction" hidden aria-hidden="true"><img src="assets/goon-v5/stage-1.png" alt=""><span></span></div>
    </aside>

    <section class="machine" aria-label="Reels">
      <div class="dock-rim" aria-hidden="true"></div><div class="reels" id="reels"></div><div class="dock-glass" aria-hidden="true"></div>
      <div class="machine-foot"><i></i><i></i><i></i></div>
      <img id="beam-ship" src="assets/visual/environment/tug.webp" alt=""><div id="effect" aria-hidden="true"></div>
    </section>
  </div>
  <p id="status" aria-live="polite">Connecting to Engine</p>
  <div id="round-actions" class="candidate-actions"><button id="retry" hidden>Reconnect</button><button id="replay-action" hidden>Play replay</button><span id="jurisdiction-readout"></span><button id="auto-stop" hidden>Stop Autoplay <span id="auto-left"></span></button></div>
  <section class="console" aria-label="Game controls">
    <div class="bridge-actions"><button id="ante-open" class="buy-launch" aria-haspopup="dialog" aria-controls="panel" aria-pressed="false">ANTE <b>OFF</b></button><button id="buy-open" class="buy-launch" aria-haspopup="dialog" aria-controls="panel">BONUS BUY</button></div>
    <div class="tools plate"><button id="info" aria-label="Game information" class="small"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></svg></button><button id="mute" disabled title="Audio disabled in this visual-only demo" aria-label="Audio disabled in this visual-only demo" aria-pressed="true" class="small"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h4l4-4v12l-4-4H4zM16 9q4 3 0 6"/><path class="mute-slash" d="m4 20 16-16"/></svg></button></div>
    <div class="stake plate"><button id="minus" class="small" aria-label="Decrease amount">−</button><button id="amount-open" aria-label="Choose amount" aria-haspopup="dialog"><span id="bet-caption">PLAY AMOUNT</span><small id="base-stake" hidden></small><strong id="stake">—</strong></button><button id="plus" class="small" aria-label="Increase amount">+</button></div>
    <button id="spin" aria-label="Spin" title="Spin (Space)"><svg aria-hidden="true" viewBox="0 0 40 40"><path d="M6 16A14 14 0 0 1 31 9l3 4M34 24A14 14 0 0 1 9 31l-3-4M34 6v7h-7M6 34v-7h7"/></svg><span>Spin</span></button>
    <div class="tools play-tools plate"><button id="auto-open" class="small" aria-label="Autoplay" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9a7.5 7.5 0 1 0 .3 6M19 4v5h-5"/><path d="m9 15 3-6 3 6m-5-2h4"/></svg></button><button id="turbo" aria-label="Turbo" aria-pressed="false" class="small"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 3-7 10h5l-1 8 8-11h-5z"/></svg></button><button id="settings" aria-label="Settings" class="small"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></svg></button></div>
    <div id="win-panel" class="readout plate"><span>WIN</span><strong id="win">—</strong></div>
    <div id="balance-panel" class="readout plate"><span>BALANCE</span><strong id="balance">—</strong></div>
  </section>
</main>

<dialog id="intro" aria-label="GOONAGEDDON welcome">
  <div id="scene"></div><div class="goon-cockpit" aria-hidden="true"><img src="assets/visual/symbols/commander.webp" alt=""><i class="visor-glint"></i><i class="goon-heart"></i><i class="cockpit-dash"></i></div><div id="intro-fx" aria-hidden="true"><img class="intro-ship" src="assets/symbols-v2/scatter-ufo.png" alt=""><i class="lever"></i><i class="alarm"></i><i class="intro-beam"></i><img class="debris d1" src="assets/symbols-v2/asteroid.png" alt=""><img class="debris d2" src="assets/symbols-v2/asteroid.png" alt=""></div>
  <div class="intro-content"><img src="assets/goon-v5/logo.png" alt="Goonageddon"><p id="scene-title">Deep Space</p><progress id="progress" value="0" max="100" aria-label="Intro progress"></progress><div id="intro-actions"><button id="enter">Play</button><button id="intro-skip" type="button">Skip intro</button><button id="intro-audio" class="small" aria-label="Intro sound" aria-pressed="false">♪</button></div></div>
</dialog>

<dialog id="bonus-cinema" aria-labelledby="cinema-title">
  <div class="cinema-world" aria-hidden="true">
    <div class="cinema-dust"></div>
    <img class="cinema-ufo" src="assets/visual/symbols/scatter.webp" alt="">
    <img class="cinema-cast" src="assets/visual/symbols/commander.webp" alt=""><canvas id="cinema-rig" width="400" height="400"></canvas>
    <img class="face-detail face-visor" src="assets/goon-v5/motion-visor.png" alt="">
    <img class="face-detail face-tongue" src="assets/goon-v5/motion-tongue.png" alt="">
    <img class="cinema-co-pilot" src="assets/goon-v5/commander.png" alt="">
    <div class="cinema-dash"><i></i><b></b><i></i></div>
    <i class="cinema-drool"></i><i class="cinema-tongue"></i>
    <i class="cinema-beam"></i><i class="cinema-impact"></i><div id="cinema-particles"></div>
  </div>
  <div class="cinema-copy"><div id="cinema-signal"></div><p id="cinema-kicker"></p><h2 id="cinema-title"></h2><strong id="cinema-award"></strong><p id="cinema-reaction"></p></div>
  <span class="cinema-progress" aria-hidden="true"></span>
  <button id="cinema-stop" type="button" hidden>Stop Autoplay</button><button id="cinema-skip" type="button" autofocus>Skip cinematic</button>
</dialog>

<dialog id="panel" aria-labelledby="panel-title"><header><h2 id="panel-title"></h2><button id="close" class="small" aria-label="Close">×</button></header><div id="panel-content"></div></dialog>
<script type="module" src="app.mjs"></script>
</body>
</html>
